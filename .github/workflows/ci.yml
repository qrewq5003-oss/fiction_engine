name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiction_engine

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Ставим сам проект: так проверяется и то, что пакет собирается,
      # и что импорты работают без подмешивания путей.
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Единственный набор. До слияния их было три: run_tests.py (9118 строк),
      # tests/ и четыре мёртвых tests_*.py в корне — одни и те же проверки
      # в двух-трёх реализациях, править приходилось синхронно.
      #
      # Порог покрытия держит планку: на момент слияния 77.8%, запас на
      # колебания. Просадка ниже 75% роняет сборку.
      - name: Тесты с покрытием
        run: >
          python -m pytest tests/ -q
          --cov=engine --cov=web
          --cov-report=term-missing:skip-covered
          --cov-fail-under=75

      # Границы слоёв: web не лезет в приватные функции engine.
      - name: Архитектурные границы
        run: python check_architecture.py

      # Планировщик — отдельное приложение со своими пакетами engine и web,
      # поэтому запускается отдельным прогоном из своего каталога: иначе
      # одноимённые пакеты перекрыли бы друг друга.
      - name: Тесты планировщика
        working-directory: planner
        run: python -m pytest tests/ -q -p no:cacheprovider

      - name: Компиляция всех модулей
        run: python -m compileall -q engine web cli.py

      # Блокирующая проверка: на 2026-09-11 mypy даёт 0 ошибок.
      # Дальнейшее ужесточение — по плану в mypy.ini.
      - name: mypy
        run: mypy engine web cli.py

  # Windows: установка тем же setup_windows.bat, что у пользователя, с
  # переносом данных архивом perenos.py; тесты обоих приложений и запуск.
  # На Linux не видно двух классов поломок: кодировка файлов по умолчанию
  # (cp1251) и `claude` как claude.cmd.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Архив переноса
        shell: bash
        run: |
          mkdir -p "$USERPROFILE/fiction_engine"
          python -c "import sqlite3, os; c = sqlite3.connect(os.path.expanduser('~/fiction_engine/projects.db')); c.execute('create table t (x)'); c.commit()"
          python perenos.py pack fiction_engine_perenos_ci.zip
          rm -rf "$USERPROFILE/fiction_engine"

      - name: setup_windows.bat
        shell: cmd
        run: setup_windows.bat < nul

      - name: Данные на месте
        shell: bash
        run: |
          test -f "$USERPROFILE/fiction_engine/projects.db"
          test -f fiction_engine/.env

      - name: Тесты
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: |
          fiction_engine\.venv\Scripts\python -m pip install -q -e "fiction_engine[dev]"
          cd fiction_engine
          .venv\Scripts\python -m pytest tests/ -q -p no:cacheprovider
          cd ..\planner
          ..\fiction_engine\.venv\Scripts\python -m pytest tests/ -q -p no:cacheprovider

      - name: Запуск приложений
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          VPY="$PWD/fiction_engine/.venv/Scripts/python.exe"
          (cd fiction_engine/web && "$VPY" app.py > ../../fe.log 2>&1 &)
          (cd planner && "$VPY" app.py > ../pl.log 2>&1 &)
          for i in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:5000/ && curl -sf -o /dev/null http://127.0.0.1:5001/ && break
            sleep 2
          done
          curl -sf -o /dev/null -w "FE %{http_code}\n" http://127.0.0.1:5000/ || { cat fe.log; exit 1; }
          curl -s -o /dev/null -w "Планировщик %{http_code}\n" http://127.0.0.1:5001/ || { cat pl.log; exit 1; }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Свои AST-анализаторы: сигнатуры вызовов между модулями и
      # классические ловушки. Ловят класс багов, который юнит-тесты
      # пропускают по построению.
      - name: Сигнатуры вызовов
        run: python tools/sigcheck.py fiction_engine

      - name: Ловушки Python
        run: python tools/pitfalls.py fiction_engine --skip-tests --fail-on-new

      # Обращения к несуществующим именам. Ровно так шесть вызовов
      # планировщика к Fiction Engine падали с NameError, маскируясь
      # под «FE не запущен», при 55 зелёных тестах.
      - name: Неопределённые имена
        run: |
          pip install pyflakes
          python tools/undefined.py fiction_engine planner

      # Доказательства из класс-тестов обязаны проверять то, что собирают.
      # Ложное обоснование дважды выводило маршрут из-под проверок: сперва
      # строкой в списке исключений, потом докстрингом функции рядом с
      # собранным и выброшенным наблюдением.
      - name: Доказательства проверяют собранное
        run: python tools/proofcheck.py fiction_engine planner

      # Запись в таблицу проекта обязана ограничиваться project_id.
      # Семь утечек принадлежности рождались не в обработчиках, а здесь:
      # `DELETE FROM symbols WHERE id=?` позволяла удалить чужой символ,
      # какие бы проверки ни стояли выше по стеку.
      - name: Запись ограничена проектом
        run: python tools/scoping.py

      # GET-обработчик не должен менять данные: по такому адресу браузер
      # волен сходить сам — предзагрузка ссылки, восстановление вкладок,
      # переход по истории. Единственной находкой был /project/<pid>/switch,
      # переключавший активный проект без действия пользователя; проверка
      # добавлена вместе с его починкой, а не с записью в исключения.
      - name: GET не меняет данные
        run: python tools/getcheck.py
