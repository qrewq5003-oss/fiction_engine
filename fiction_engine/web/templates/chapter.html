{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <div class="page-title">
    Глава {{ chapter.number }}{% if chapter.title %}: {{ chapter.title }}{% endif %}
  </div>
  <div class="page-sub">
    {{ chapter.word_count }} слов · {{ chapter.created_at[:10] }}
    · <a href="/" style="color:var(--accent2);">← Назад</a>
  </div>
</div>

<div style="display:flex;gap:8px;margin-bottom:16px;">
  <button class="btn btn-secondary btn-sm" onclick="checkContinuity()">
    🔗 Проверить непрерывность
  </button>
  <span id="continuity-status" style="font-size:12px;color:var(--text2);align-self:center;"></span>
  <span style="flex:1;"></span>
  <button class="btn btn-secondary btn-sm" id="btn-edit" onclick="startEdit()">✏️ Редактировать</button>
  <button class="btn btn-success btn-sm" id="btn-save-edit" onclick="saveEdit()" style="display:none;">💾 Сохранить</button>
  <button class="btn btn-secondary btn-sm" id="btn-cancel-edit" onclick="cancelEdit()" style="display:none;">Отмена</button>
  <button class="btn btn-secondary btn-sm" onclick="deleteChapter()" title="Удалить главу">🗑 Удалить</button>
</div>

<div id="continuity-result" style="display:none;" class="card" style="border-color:var(--warning);">
  <div class="card-title" style="color:var(--warning);">🔗 Непрерывность</div>
  <div id="continuity-content" style="font-size:13px;"></div>
</div>

<div class="card">
  <div id="chapter-text" spellcheck="true"
       style="white-space:pre-wrap;font-size:14px;line-height:1.8;outline:none;
              font-family:'Georgia',serif;color:var(--text);max-width:700px;">{{ chapter.content }}</div>
</div>

{% endblock %}

{% block scripts %}
<script>
// Правка главы прямо на странице
const CHAPTER_NUM = {{ chapter.number }};
let _chapterOriginal = null;
function _editButtons(editing) {
  document.getElementById('btn-edit').style.display = editing ? 'none' : '';
  document.getElementById('btn-save-edit').style.display = editing ? '' : 'none';
  document.getElementById('btn-cancel-edit').style.display = editing ? '' : 'none';
}
function startEdit() {
  const el = document.getElementById('chapter-text');
  _chapterOriginal = el.innerText;
  makeEditable(el);
  el.style.border = '1px dashed var(--accent)'; el.style.padding = '8px';
  el.focus();
  _editButtons(true);
}
function cancelEdit() {
  const el = document.getElementById('chapter-text');
  if (_chapterOriginal !== null) el.innerText = _chapterOriginal;
  el.contentEditable = 'false'; el.style.border = ''; el.style.padding = '';
  _editButtons(false);
}
async function saveEdit() {
  const el = document.getElementById('chapter-text');
  const r = await apiPost(`/chapter/${CHAPTER_NUM}/save`, { text: el.innerText });
  if (r.error) { showToast('Ошибка: ' + r.error, 'error'); return; }
  _chapterOriginal = el.innerText;
  el.contentEditable = 'false'; el.style.border = ''; el.style.padding = '';
  _editButtons(false);
  showToast(`Глава сохранена · ${r.word_count} слов`, 'success');
}

async function deleteChapter() {
  if (await removeChapter(CHAPTER_NUM)) setTimeout(() => location.href = '/', 1500);
}

async function checkContinuity() {
  const statusEl = document.getElementById('continuity-status');
  const resultEl = document.getElementById('continuity-result');
  const contentEl = document.getElementById('continuity-content');
  statusEl.textContent = 'Проверяю...';

  const r = await apiPost('/api/continuity/check', {
    chapter_num: {{ chapter.number }},
    text: document.getElementById('chapter-text').innerText
  });

  if (r.error) {
    statusEl.textContent = 'Ошибка: ' + r.error;
    return;
  }

  if (r.skipped) {                       // модель не вызывалась — не «чисто»
    statusEl.textContent = 'ℹ ' + r.skipped;
    return;
  }
  if (!r.violations || r.violations.length === 0) {
    statusEl.textContent = '✓ Нарушений не найдено';
    statusEl.style.color = 'var(--success)';
    return;
  }

  statusEl.textContent = `⚠ Найдено ${r.count} нарушений`;
  statusEl.style.color = 'var(--warning)';

  let html = '';
  for (const v of r.violations) {
    const color = v.severity === 'critical' ? 'var(--error)' : 'var(--warning)';
    html += `<div style="margin-bottom:12px;padding:8px;background:var(--surface2);border-radius:6px;border-left:3px solid ${color};">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Факт серии: ${v.fact}</div>
      <div style="color:${color};">${v.violation}</div>
    </div>`;
  }
  contentEl.innerHTML = html;
  resultEl.style.display = 'block';
}
</script>
{% endblock %}
