[mypy]
# Начальная конфигурация mypy для постепенного ужесточения.
#
# Текущее состояние: --ignore-missing-imports, без strict.
# Когда все внешние зависимости добавлены в requirements — убрать ignore-missing-imports.
# Когда mypy errors = 0 — добавить --strict секцию по модулям.
#
# Порядок ужесточения:
#   1. ignore-missing-imports → False (когда openai/anthropic stubs установлены)
#   2. no-strict-optional → убрать (начать с engine/db_core.py, engine/db_chapters.py)
#   3. disallow-untyped-defs = True (по модулям: начать с pipeline_steps.py)
#   4. strict = True (конечная цель)

ignore_missing_imports = True
no_strict_optional = True
follow_imports = silent
exclude = engine/__pycache__|web/__pycache__|tests/__pycache__

# Отдельные модули с более строгими правилами
# (добавлять по мере исправления ошибок)

[mypy-engine.db_core]
disallow_untyped_defs = True

[mypy-engine.db_chapters]
disallow_untyped_defs = True

[mypy-engine.cognitive_memory]
disallow_untyped_defs = True
