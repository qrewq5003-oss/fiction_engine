[mypy]
# Конфигурация mypy. Ужесточается по шагам.
#
# Состояние на 2026-09-11: `mypy engine web cli.py --explicit-package-bases`
# даёт 0 ошибок. До этого mypy не запускался ни разу — его просто не было
# в системе, — и проверка в CI стояла с continue-on-error. Теперь она
# блокирующая: любая новая ошибка типов роняет сборку.
#
# Остаток плана ужесточения:
#   1. no-strict-optional → убрать (начать с engine/db_core.py, engine/db_chapters.py)
#   2. disallow-untyped-defs = True по остальным модулям (сейчас включено
#      на db_core, db_chapters, cognitive_memory — они типизированы полностью)
#   3. ignore-missing-imports → False (когда появятся stubs для openai/anthropic)
#   4. strict = True (конечная цель)
#
# web/ не пакет (нет __init__.py), поэтому нужен --explicit-package-bases:
# без него mypy не может отобразить web/blueprints/*.py в имена модулей.

ignore_missing_imports = True
no_strict_optional = True
follow_imports = silent
explicit_package_bases = True
exclude = (^|/)(\.venv|__pycache__|\.mypy_cache|\.pytest_cache)/

# Отдельные модули с более строгими правилами
# (добавлять по мере исправления ошибок)

[mypy-engine.db_core]
disallow_untyped_defs = True

[mypy-engine.db_chapters]
disallow_untyped_defs = True

[mypy-engine.cognitive_memory]
disallow_untyped_defs = True
