[mypy]
# Конфигурация mypy. Ужесточается по шагам.
#
# Состояние на 2026-09-11: `mypy engine web cli.py --explicit-package-bases`
# даёт 0 ошибок. До этого mypy не запускался ни разу — его просто не было
# в системе, — и проверка в CI стояла с continue-on-error. Теперь она
# блокирующая: любая новая ошибка типов роняет сборку.
#
# Остаток плана ужесточения:
#   1. no-strict-optional → убрать (начать с engine/db_core.py, engine/db_chapters.py)
#   2. Сокращать список исключений ниже: там модули, где аннотированы
#      не все функции. Строгость теперь ВКЛЮЧЕНА ПО УМОЛЧАНИЮ — новый
#      модуль обязан быть типизирован, а не молча проехать мимо.
#   3. ignore-missing-imports → False (когда появятся stubs для openai/anthropic)
#   4. strict = True (конечная цель)

ignore_missing_imports = True
no_strict_optional = True
disallow_untyped_defs = True
follow_imports = silent
exclude = (^|/)(\.venv|__pycache__|\.mypy_cache|\.pytest_cache)/

# ─── Исключения ──────────────────────────────────────────────────────────────
#
# Модули, где аннотированы ещё не все функции. Список должен только
# сокращаться. Раньше здесь был обратный перечень — строгих модулей, — и
# любой НОВЫЙ модуль по умолчанию оказывался нестрогим и проезжал молча.

[mypy-engine.api]
# не типизировано функций: 8
disallow_untyped_defs = False

